[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "casemind-backend"
version = "0.1.0"
description = "CaseMind ML Investigation Platform & Simulation Engine"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "sqlalchemy>=2.0.36",
    "psycopg[binary]>=3.2.3",
    "numpy>=2.0",
    "scikit-learn>=1.5",
    "lightgbm>=4.5",
]

# Dev-only tools, installed by `uv sync` but never by the production image.
[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "ruff>=0.8.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
# E/F: pyflakes + pycodestyle errors, I: import sorting, UP: modern syntax, B: likely bugs
select = ["E", "F", "I", "UP", "B"]
# Line length is the formatter's job (`ruff format`); the linter would double-report it.
ignore = ["E501"]
